<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Rishabh Vyas">
  <style>
    .t { animation: tw 3.2s ease-in-out infinite; }
    .t:nth-of-type(2n) { animation-delay: 1.1s; }
    .t:nth-of-type(3n) { animation-delay: 2.1s; }
    .wave { animation: drift 8s ease-in-out infinite alternate; }
    @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes drift { to { transform: translateX(-30px); } }
    @media (prefers-reduced-motion: reduce) { .t, .wave { animation: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".55" stop-color="#0e4429"/>
      <stop offset="1" stop-color="#26a641"/>
    </linearGradient>
  </defs>
  <rect width="900" height="230" fill="#0d1117"/>
  <path class="wave" fill="url(#g)" d="M0 0H930V170C850 205 790 150 720 182C640 220 590 140 500 176C410 212 360 150 280 186C200 222 120 160 0 196Z"/>
  <g fill="#39d353">
